<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volumetric Cloud Flight - Extended Horizon</title>
    <style>
        /* Reset and full screen layout */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000; 
        }
        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
        }
    </style>
</head>
<body>
    <canvas id="glcanvas"></canvas>

    <script>
        const canvas = document.getElementById('glcanvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

        if (!gl) {
            alert('Your browser does not support WebGL.');
            throw new Error('WebGL not supported');
        }

        const vertexShaderSource = `
            attribute vec2 position;
            void main() {
                gl_Position = vec4(position, 0.0, 1.0);
            }
        `;

        const fragmentShaderSource = `
            precision highp float;
            uniform vec2 u_resolution;
            uniform float u_time;

            // 1D Hash function for pseudo-random noise generation
            float hash(float n) { 
                return fract(sin(n)*43758.5453123); 
            }

            // 3D Value Noise
            float noise(vec3 x) {
                vec3 p = floor(x);
                vec3 f = fract(x);
                f = f*f*(3.0-2.0*f);
                float n = p.x + p.y*57.0 + 113.0*p.z;
                return mix(mix(mix( hash(n+  0.0), hash(n+  1.0),f.x),
                               mix( hash(n+ 57.0), hash(n+ 58.0),f.x),f.y),
                           mix(mix( hash(n+113.0), hash(n+114.0),f.x),
                               mix( hash(n+170.0), hash(n+171.0),f.x),f.y),f.z);
            }

            // Fractional Brownian Motion (fBm)
            float fbm(vec3 p) {
                float f = 0.0;
                mat3 m = mat3( 0.00,  0.80,  0.60,
                              -0.80,  0.36, -0.48,
                              -0.60, -0.48,  0.64 );
                f  = 0.5000*noise( p ); p = m*p*2.02;
                f += 0.2500*noise( p ); p = m*p*2.03;
                f += 0.1250*noise( p ); p = m*p*2.01;
                f += 0.0625*noise( p );
                return f;
            }

            // Cloud density map
            float map(vec3 p) {
                float d = fbm(p * 0.5) - 0.4;
                d -= p.y * 0.15; 
                return max(0.0, d);
            }

            // Generate realistic sky backdrop
            vec3 renderSky(vec3 ro, vec3 rd) {
                vec3 sunDir = normalize(vec3(-1.0, 0.3, 1.0));
                float sun = max(0.0, dot(rd, sunDir));
                
                vec3 sky = vec3(0.3, 0.5, 0.8) - rd.y * 0.3;
                sky += vec3(1.0, 0.8, 0.5) * pow(sun, 16.0) * 0.5;
                sky += vec3(1.0, 0.9, 0.7) * pow(sun, 64.0) * 1.5;
                
                return max(sky, 0.0);
            }

            void main() {
                vec2 uv = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / min(u_resolution.x, u_resolution.y);

                vec3 ro = vec3(0.0, 1.0, u_time * 3.0);
                vec3 rd = normalize(vec3(uv, 1.2));

                float bank = sin(u_time * 0.3) * 0.15;
                mat2 rot = mat2(cos(bank), -sin(bank), sin(bank), cos(bank));
                rd.xy *= rot;
                rd.yz *= mat2(cos(0.05), -sin(0.05), sin(0.05), cos(0.05));

                vec3 sunDir = normalize(vec3(-1.0, 0.3, 1.0));

                vec4 sum = vec4(0.0);
                float t = 0.0; 
                
                // Pushing the maximum render distance much further out
                const float MAX_DIST = 90.0; 

                // Increased iterations to 150 to handle the extended horizon
                for(int i = 0; i < 150; i++) {
                    // Early exit if opaque, OR if we've reached the maximum distance
                    if(sum.a > 0.99 || t > MAX_DIST) break; 

                    vec3 pos = ro + t * rd;
                    float den = map(pos);

                    // ==========================================
                    // POP-IN FIX: Volumetric Density Falloff
                    // ==========================================
                    // As 't' approaches MAX_DIST, force the cloud density smoothly to 0.
                    // This means clouds literally dissolve into nothing before they hit the clipping plane.
                    den *= 1.0 - smoothstep(MAX_DIST * 0.5, MAX_DIST, t);

                    if(den > 0.01) {
                        float dif = clamp((den - map(pos + 0.3 * sunDir)) / 0.3, 0.0, 1.0);
                        vec3 lin = vec3(1.0, 0.9, 0.8) * dif + vec3(0.2, 0.3, 0.4);

                        vec4 col = vec4(mix(vec3(1.0), vec3(0.7, 0.75, 0.8), den), den);
                        col.rgb *= lin;

                        // ==========================================
                        // AERIAL PERSPECTIVE (Distance Fog)
                        // ==========================================
                        // Sample the horizon sky color and smoothly tint distant clouds 
                        // as they get further away, simulating thick atmosphere.
                        vec3 horizonCol = vec3(0.35, 0.55, 0.8) - rd.y * 0.2;
                        col.rgb = mix(col.rgb, horizonCol, smoothstep(MAX_DIST * 0.3, MAX_DIST, t));

                        col.a *= 0.4; 
                        col.rgb *= col.a;

                        sum = sum + col * (1.0 - sum.a);
                    }

                    // Adaptive stepping: take slightly larger steps further away 
                    // to reach the extended horizon without killing framerates.
                    t += max(0.05, 0.03 * t); 
                }

                vec3 bg = renderSky(ro, rd);
                vec3 finalCol = mix(bg, sum.rgb, sum.a);

                // Gamma Correction
                finalCol = pow(finalCol, vec3(1.0/2.2));

                gl_FragColor = vec4(finalCol, 1.0);
            }
        `;

        function compileShader(gl, source, type) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error("Shader Compile Error:", gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        const vs = compileShader(gl, vertexShaderSource, gl.VERTEX_SHADER);
        const fs = compileShader(gl, fragmentShaderSource, gl.FRAGMENT_SHADER);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);

        const vertices = new Float32Array([
            -1, -1,   1, -1,
            -1,  1,   1,  1
        ]);
        
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

        const positionLocation = gl.getAttribLocation(program, "position");
        gl.enableVertexAttribArray(positionLocation);
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

        const resolutionLocation = gl.getUniformLocation(program, "u_resolution");
        const timeLocation = gl.getUniformLocation(program, "u_time");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        let startTime = performance.now();

        function render(currentTime) {
            gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
            gl.uniform1f(timeLocation, (currentTime - startTime) / 1000.0);

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
